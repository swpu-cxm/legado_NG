name: Gxj Private Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: cursor/manual-ai-model-ids-16e1
      tag_name:
        description: GitHub Release tag (e.g. v3.26.share-json-import)
        required: true
        default: v3.26.share-json-import
      release_name:
        description: Release title shown on GitHub
        required: true
        default: v3.26.share-json-import — 阅读·私有（gxj · 书源分享导入）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Release Apk Sign
        run: |
          if [ -z "$RELEASE_KEY_STORE" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "Release signing secrets are required for gxj private APK."
            exit 1
          fi
          echo -e "\n" >> gradle.properties
          echo RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" >> gradle.properties
          echo RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" >> gradle.properties
          echo RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" >> gradle.properties
          echo RELEASE_STORE_FILE="./key.jks" >> gradle.properties
          echo "$RELEASE_KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/app/key.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build gxj release
        run: |
          chmod +x gradlew
          ./gradlew assembleGxjRelease -PUPDATE_CHANNEL=official --build-cache --parallel --daemon --warning-mode all

      - name: Prepare release asset
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          APK=$(ls "$GITHUB_WORKSPACE"/app/build/outputs/apk/gxj/release/*.apk | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/apk/legado_NG_gxj_private-signed.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ github.workspace }}/apk/legado_NG_gxj_private-signed.apk
